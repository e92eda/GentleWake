<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GentleWake</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, sans-serif;
      background: #f0f4f8;
      display: flex;
      justify-content: center;
      padding: 24px 16px;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 28px 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
      margin-bottom: 16px;
    }
    h1 {
      font-size: 22px;
      color: #1a1a2e;
      margin-bottom: 24px;
      text-align: center;
    }
    h2 {
      font-size: 16px;
      color: #1a1a2e;
      margin-bottom: 16px;
    }
    .section { margin-bottom: 24px; }
    label.section-label {
      display: block;
      font-size: 13px;
      color: #666;
      margin-bottom: 8px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input[type="time"] {
      width: 100%;
      font-size: 36px;
      font-weight: 300;
      text-align: center;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      padding: 12px;
      color: #1a1a2e;
      outline: none;
    }
    input[type="time"]:focus { border-color: #4a90e2; }
    input[type="number"] {
      width: 100%;
      font-size: 18px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      padding: 10px;
      color: #1a1a2e;
      outline: none;
    }
    input[type="number"]:focus { border-color: #4a90e2; }
    .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }
    .days input[type="checkbox"] { display: none; }
    .days label {
      display: block;
      text-align: center;
      padding: 10px 0;
      border-radius: 8px;
      border: 2px solid #e0e0e0;
      font-size: 14px;
      color: #555;
      cursor: pointer;
      transition: all 0.15s;
    }
    .days input:checked + label {
      background: #4a90e2;
      border-color: #4a90e2;
      color: white;
      font-weight: 600;
    }
    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid #f0f0f0;
    }
    .toggle-row:last-child { border-bottom: none; }
    .toggle-label { font-size: 15px; color: #333; }
    .toggle-sub { font-size: 12px; color: #999; margin-top: 2px; }
    .switch { position: relative; width: 48px; height: 28px; }
    .switch input { display: none; }
    .slider {
      position: absolute;
      inset: 0;
      background: #ccc;
      border-radius: 28px;
      cursor: pointer;
      transition: 0.2s;
    }
    .slider:before {
      content: "";
      position: absolute;
      width: 22px; height: 22px;
      left: 3px; top: 3px;
      background: white;
      border-radius: 50%;
      transition: 0.2s;
    }
    .switch input:checked + .slider { background: #4a90e2; }
    .switch input:checked + .slider:before { transform: translateX(20px); }
    .skip-switch .switch input:checked + .slider { background: #e07b4a; }
    button[type="submit"], button.action {
      width: 100%;
      padding: 16px;
      background: #4a90e2;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.15s;
    }
    button.action.secondary {
      background: #6c757d;
    }
    button.action.stop {
      background: #e07b4a;
    }
    button[type="submit"]:active, button.action:active { opacity: 0.85; }
    .saved-msg {
      text-align: center;
      color: #4caf50;
      font-size: 14px;
      margin-top: 12px;
    }
    /* 在床状態カード */
    .status-card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
      margin-bottom: 16px;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      font-size: 14px;
    }
    .status-row .label { color: #666; }
    .status-row .value { font-family: monospace; font-weight: 600; color: #1a1a2e; }
    .bed-indicator {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 16px;
      transition: background 0.3s;
    }
    .bed-indicator.in-bed { background: #d4edda; color: #155724; }
    .bed-indicator.out-bed { background: #f8d7da; color: #721c24; }
    .bed-indicator.unknown { background: #e9ecef; color: #6c757d; }
    .small-msg {
      font-size: 12px;
      color: #999;
      margin-top: 8px;
      text-align: center;
    }
  </style>
</head>
<body>
<div style="width: 100%; max-width: 400px;">

  <!-- 在床状態 -->
  <div class="status-card">
    <h2>📡 センサー状態</h2>
    <div id="bed-indicator" class="bed-indicator unknown">取得中...</div>
    <div class="status-row"><span class="label">raw</span><span id="val-raw" class="value">-</span></div>
    <div class="status-row"><span class="label">tared</span><span id="val-tared" class="value">-</span></div>
    <div class="status-row"><span class="label">tare offset</span><span id="val-offset" class="value">-</span></div>
    <div class="status-row"><span class="label">閾値</span><span id="val-threshold" class="value">-</span></div>
    <button type="button" class="action secondary" id="tare-btn">⚖️ 風袋引き (今この瞬間の値を 0 にする)</button>
    <div id="tare-msg" class="small-msg"></div>
  </div>

  <!-- アラーム + 在床設定 -->
  <div class="card">
    <h1>⏰ GentleWake</h1>
    <form method="post" action="/save">

      <div class="section">
        <label class="section-label">起床時刻</label>
        <input type="time" name="alarm_time" value="{{ config.alarm_time }}">
      </div>

      <div class="section">
        <label class="section-label">曜日</label>
        <div class="days">
          {% for day in ["月","火","水","木","金","土","日"] %}
          <div>
            <input type="checkbox" name="days" value="{{ day }}"
                   id="day_{{ day }}"
                   {% if day in config.days %}checked{% endif %}>
            <label for="day_{{ day }}">{{ day }}</label>
          </div>
          {% endfor %}
        </div>
      </div>

      <div class="section">
        <div class="toggle-row">
          <div>
            <div class="toggle-label">アラーム有効</div>
          </div>
          <label class="switch">
            <input type="checkbox" name="enabled"
                   {% if config.enabled %}checked{% endif %}>
            <span class="slider"></span>
          </label>
        </div>
        <div class="toggle-row skip-switch">
          <div>
            <div class="toggle-label">今日はスキップ</div>
            <div class="toggle-sub">翌日に自動解除されます</div>
          </div>
          <label class="switch">
            <input type="checkbox" name="skip_today"
                   {% if config.skip_today %}checked{% endif %}>
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <div class="section">
        <label class="section-label">在床判定 閾値 (raw - tare)</label>
        <input type="number" name="in_bed_threshold" min="1" step="100"
               value="{{ config.in_bed_threshold }}">
        <div class="toggle-sub" style="margin-top: 6px;">
          tared 値がこの値を超えたら「載っている」と判定します。
        </div>
      </div>

      <div class="section">
        <label class="section-label">デバウンス (連続サンプル数)</label>
        <input type="number" name="consecutive_samples" min="1" max="30" step="1"
               value="{{ config.consecutive_samples }}">
        <div class="toggle-sub" style="margin-top: 6px;">
          状態が変わったと判定するのに必要な連続一致サンプル数。
        </div>
      </div>

      <button type="submit">設定を保存</button>
      {% if saved %}
      <div class="saved-msg">✓ 保存しました</div>
      {% endif %}

    </form>
  </div>

  <!-- アラームテスト -->
  <div class="card">
    <h2>🔔 アラームテスト</h2>
    <div class="toggle-sub" style="margin-bottom: 12px;">
      在床判定を無視して、今すぐアラーム (Echo で音楽再生) を鳴らします。
    </div>
    <button type="button" class="action secondary" id="test-alarm-btn">▶ 今すぐ鳴らす</button>
    <div id="test-alarm-msg" class="small-msg"></div>
  </div>

</div>

<script>
  async function refreshState() {
    try {
      const r = await fetch('/state');
      const s = await r.json();
      const indicator = document.getElementById('bed-indicator');
      if (!s.available) {
        indicator.className = 'bed-indicator unknown';
        indicator.textContent = '⚠️ センサ未接続 (モック)';
      } else if (s.raw === null) {
        indicator.className = 'bed-indicator unknown';
        indicator.textContent = '取得中...';
      } else if (s.in_bed) {
        indicator.className = 'bed-indicator in-bed';
        indicator.textContent = '🛏️ 在床中';
      } else {
        indicator.className = 'bed-indicator out-bed';
        indicator.textContent = '🚶 離床中';
      }
      document.getElementById('val-raw').textContent = s.raw ?? '-';
      document.getElementById('val-tared').textContent = s.tared ?? '-';
      document.getElementById('val-offset').textContent = s.tare_offset;
      document.getElementById('val-threshold').textContent = s.threshold;
    } catch (e) {
      // 通信失敗時はそのまま
    }
  }

  let alarmPlaying = false;
  const alarmBtn = document.getElementById('test-alarm-btn');

  function setAlarmBtnState(playing) {
    alarmPlaying = playing;
    if (playing) {
      alarmBtn.textContent = '■ 停止';
      alarmBtn.classList.remove('secondary');
      alarmBtn.classList.add('stop');
    } else {
      alarmBtn.textContent = '▶ 今すぐ鳴らす';
      alarmBtn.classList.remove('stop');
      alarmBtn.classList.add('secondary');
    }
  }

  alarmBtn.addEventListener('click', async () => {
    const msg = document.getElementById('test-alarm-msg');
    const endpoint = alarmPlaying ? '/stop-alarm' : '/test-alarm';
    const nextState = !alarmPlaying;
    msg.textContent = '...';
    try {
      const r = await fetch(endpoint, { method: 'POST' });
      const j = await r.json();
      if (j.ok) {
        setAlarmBtnState(nextState);
        msg.textContent = nextState ? '✓ アラーム送信 (数秒後に鳴ります)' : '✓ 停止コマンド送信';
        msg.style.color = '#4caf50';
      } else {
        msg.textContent = `✗ ${j.error || '失敗'}`;
        msg.style.color = '#dc3545';
      }
    } catch (e) {
      msg.textContent = '✗ 通信失敗';
      msg.style.color = '#dc3545';
    }
  });

  document.getElementById('tare-btn').addEventListener('click', async () => {
    const msg = document.getElementById('tare-msg');
    msg.textContent = '...';
    try {
      const r = await fetch('/tare', { method: 'POST' });
      const j = await r.json();
      if (j.ok) {
        msg.textContent = `✓ tare = ${j.tare_offset}`;
        msg.style.color = '#4caf50';
      } else {
        msg.textContent = `✗ ${j.error}`;
        msg.style.color = '#dc3545';
      }
      refreshState();
    } catch (e) {
      msg.textContent = '✗ 通信失敗';
      msg.style.color = '#dc3545';
    }
  });

  refreshState();
  setInterval(refreshState, 1500);
</script>

</body>
</html>
